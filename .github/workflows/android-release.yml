name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v1.0.0)'
        required: false
        default: ''
      draft:
        description: 'Create draft release'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Mark as prerelease'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Build, Sign & Publish Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle wrapper executable
        run: chmod +x apps/android/gradlew

      - name: Run Android Unit Tests
        working-directory: apps/android
        run: |
          echo "Running Android unit tests before build..."
          ./gradlew testDebugUnitTest --no-daemon --info

      - name: Validate & Prepare Signing Keystore
        id: prepare-keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing required Android signing secrets!"
            echo "Please configure the following GitHub Secrets in repository Settings > Secrets and variables > Actions:"
            echo "  - ANDROID_KEYSTORE_BASE64"
            echo "  - ANDROID_KEYSTORE_PASSWORD"
            echo "  - ANDROID_KEY_ALIAS"
            echo "  - ANDROID_KEY_PASSWORD"
            echo "Use scripts/generate-android-keystore.sh to generate these values securely."
            exit 1
          fi

          KEYSTORE_DIR="${{ runner.temp }}/keystore"
          mkdir -p "$KEYSTORE_DIR"
          KEYSTORE_PATH="$KEYSTORE_DIR/release.jks"

          # Decode keystore safely
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

          echo "keystore_path=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"
          echo "✅ Keystore safely decoded to temporary runner path."

      - name: Build Signed Release APK
        working-directory: apps/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.prepare-keystore.outputs.keystore_path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "Building signed release APK..."
          ./gradlew assembleRelease --no-daemon

      - name: Verify APK Signature & Compute Checksum
        id: verify-apk
        run: |
          APK_SOURCE="apps/android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_SOURCE" ]; then
            echo "::error::Expected release APK at $APK_SOURCE was not generated."
            exit 1
          fi

          # Locate apksigner from Android SDK
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner tool not found in Android SDK ($ANDROID_SDK_ROOT)."
            exit 1
          fi

          echo "Verifying APK signature using $APKSIGNER..."
          $APKSIGNER verify --verbose "$APK_SOURCE"

          # Stage release assets with clean asset name ClipSync.apk
          mkdir -p release-assets
          cp "$APK_SOURCE" release-assets/ClipSync.apk

          cd release-assets
          sha256sum ClipSync.apk > ClipSync.apk.sha256
          SHA256_HASH=$(cut -d ' ' -f 1 ClipSync.apk.sha256)
          FILE_SIZE=$(ls -lh ClipSync.apk | awk '{print $5}')

          echo "sha256=$SHA256_HASH" >> "$GITHUB_OUTPUT"
          echo "file_size=$FILE_SIZE" >> "$GITHUB_OUTPUT"
          echo "APK successfully verified and staged: ClipSync.apk ($FILE_SIZE, SHA-256: $SHA256_HASH)"

      - name: Shred Temporary Keystore
        if: always()
        run: |
          if [ -d "${{ runner.temp }}/keystore" ]; then
            rm -rf "${{ runner.temp }}/keystore"
            echo "Temporary keystore shredded."
          fi

      - name: Determine Release Tag
        id: release-tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v1.0.0"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-tag.outputs.tag }}
          name: "ClipSync Android ${{ steps.release-tag.outputs.tag }}"
          body: |
            ### ClipSync for Android — ${{ steps.release-tag.outputs.tag }}

            Official signed Android APK release for **ClipSync Universal Cloud Clipboard**.

            ---

            #### 📥 Direct Download
            - **[ClipSync.apk](https://github.com/VinitSurve/clipsync/releases/download/${{ steps.release-tag.outputs.tag }}/ClipSync.apk)** (${{ steps.verify-apk.outputs.file_size }})
            - **Permanent Stable Download URL**: [`https://github.com/VinitSurve/clipsync/releases/latest/download/ClipSync.apk`](https://github.com/VinitSurve/clipsync/releases/latest/download/ClipSync.apk)

            #### 🔒 Integrity & Security
            - **SHA-256 Checksum**:
              ```text
              ${{ steps.verify-apk.outputs.sha256 }}
              ```
            - **Checksum File**: [`ClipSync.apk.sha256`](https://github.com/VinitSurve/clipsync/releases/download/${{ steps.release-tag.outputs.tag }}/ClipSync.apk.sha256)
            - **Signing Certificate**: Signed with official ClipSync release key (v2/v3 signing schemes). Future updates can be installed in-place over this release.

            ---

            #### 📱 1-Click Installation Instructions (No ADB Required)
            1. Tap the download link above on your Android phone using your browser (e.g. Chrome).
            2. When Android prompts *"For your security, your phone is not allowed to install unknown apps from this source"*:
               - Tap **Settings**.
               - Turn **ON** "Allow from this source".
               - Return to the download and tap **Install** (or **Update**).
            3. *Note*: **USB debugging, Developer Options, ADB, and wireless debugging are NOT required.**

            #### ⚙️ Recommended Xiaomi / Redmi (MIUI & HyperOS) Settings:
            1. Long-press **ClipSync** icon > tap **App info** (ℹ️).
            2. Enable **Autostart**.
            3. Under **Battery saver**, select **No restrictions**.
            4. Add the **ClipSync** Quick Settings tile to your top drawer for instant 1-tap clipboard synchronization from inside any app.
          files: |
            release-assets/ClipSync.apk
            release-assets/ClipSync.apk.sha256
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}

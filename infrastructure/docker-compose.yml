version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: clipsync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: clipsync
      POSTGRES_PASSWORD: clipsync_secure_password
      POSTGRES_DB: clipsync
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clipsync -d clipsync"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: clipsync-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: clipsync_minio_admin
      MINIO_ROOT_PASSWORD: clipsync_minio_secret_key
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 clipsync_minio_admin clipsync_minio_secret_key;
      /usr/bin/mc mb myminio/clipsync-blobs --ignore-existing;
      exit 0;
      "

  server:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    container_name: clipsync-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    ports:
      - "8787:8787"
    environment:
      NODE_ENV: production
      PORT: 8787
      HOST: 0.0.0.0
      DATABASE_URL: postgres://clipsync:clipsync_secure_password@postgres:5432/clipsync
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: clipsync-blobs
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: clipsync_minio_admin
      AWS_SECRET_ACCESS_KEY: clipsync_minio_secret_key
      SERVER_ORIGIN: http://localhost:8787

volumes:
  postgres_data:
  minio_data:
